# NorthPeak Goods — MLflow-logged CTR Optimization

bundle:
  name: northpeak_ctr

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog for demo resources
    default: solution_builder
  schema:
    description: Schema within the catalog
    default: demo_mlflow_logged_ctr_optimization
  warehouse_id:
    description: SQL warehouse powering the dashboard and Genie space

sync:
  include:
    - src/**

targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
