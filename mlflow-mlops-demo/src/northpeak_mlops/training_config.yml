destination:
  catalog: solution_builder
  schema: demo_mlflow_logged_ctr_optimization
  tables:
    training_features: gold_segment_ctr_daily
    predictions: gold_ctr_predictions
    monitoring_metrics: gold_model_monitoring_metrics
    retrain_decisions: model_retrain_decisions
  registered_model:
    name: ctr_regressor
    alias: champion
  experiments:
    initial_training:
      id: "2232515377525630"
    automated_retraining:
      id: "3770970266054053"
  dashboard_id: 01f1ab98bd911eef89a8f2256d0361d1
  genie_space_id: 01f1ab974de6124eb6533ad0625849bf

categorical_features:
  - channel
  - device
  - country
  - visitor_type
  - campaign_id
  - objective

feature_sets:
  fs_a_core:
    - channel
    - device
    - country
    - visitor_type
  fs_b_campaign:
    - channel
    - device
    - country
    - visitor_type
    - campaign_id
    - objective
  fs_c_full:
    - channel
    - device
    - country
    - visitor_type
    - campaign_id
    - objective
    - day_of_week
    - impressions
    - is_drift_window

xgboost_search_space:
  n_estimators:
    type: int
    low: 150
    high: 500
  max_depth:
    type: int
    low: 3
    high: 9
  learning_rate:
    type: float
    low: 0.02
    high: 0.25
    log: true
  subsample:
    type: float
    low: 0.7
    high: 1.0
  colsample_bytree:
    type: float
    low: 0.7
    high: 1.0

monitoring:
  windows_days: [1, 7, 28]
  dimensions:
    - channel
    - device
    - country
    - visitor_type
    - campaign_name
    - objective
  warning_rmse_increase_pct: 10.0
  critical_rmse_increase_pct: 20.0
  consecutive_critical_periods: 2
  minimum_impressions: 50000
  retrain_cooldown_days: 7
