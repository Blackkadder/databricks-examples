resources:
  jobs:
    northpeak_ctr_retrain:
      name: "[${bundle.target}] NorthPeak CTR Retrain"
      description: Production-shaped Python task using reusable MLOps helpers
      tasks:
        - task_key: retrain_model
          spark_python_task:
            python_file: ../src/jobs/retrain_model.py
            parameters:
              - --catalog
              - ${resources.schemas.ctr_schema.catalog_name}
              - --schema
              - ${resources.schemas.ctr_schema.name}
              - --experiment-path
              - /Users/${workspace.current_user.userName}/${bundle.target}_northpeak_ctr/experiments/automated_retrain
              - --min-improvement-pct
              - "0.0"
          environment_key: ml
      environments:
        - environment_key: ml
          spec:
            client: "4"
            dependencies:
              - xgboost==2.1.3
              - scikit-learn==1.5.2
              - optuna==4.1.0
              - mlflow>=2.13.0
              - databricks-sdk>=0.114.0
              - PyYAML==6.0.2
