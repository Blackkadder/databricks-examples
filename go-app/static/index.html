<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go Static App - Databricks</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            max-width: 600px;
            width: 90%;
        }
        .logo {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #a0a0c0;
            margin-bottom: 2rem;
        }
        .badge {
            display: inline-block;
            padding: 0.4rem 1rem;
            background: rgba(0, 200, 150, 0.15);
            border: 1px solid rgba(0, 200, 150, 0.3);
            border-radius: 20px;
            color: #00c896;
            font-size: 0.9rem;
            margin: 0.3rem;
        }
        .info {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.9rem;
            color: #808090;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">&#x1F680;</div>
        <h1>Go Static App</h1>
        <p class="subtitle">A static front-end served by a Go HTTP server on Databricks Apps</p>
        <div>
            <span class="badge">Golang</span>
            <span class="badge">Databricks Apps</span>
            <span class="badge">Static Frontend</span>
        </div>
        <div class="info">
            <p>Served by <strong>net/http</strong> &middot; Built &amp; deployed on Databricks</p>
        </div>
    </div>
</body>
</html>
